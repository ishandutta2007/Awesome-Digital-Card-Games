<svg fill="none" width="100%" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #fbbf24;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float 8s ease-in-out infinite reverse;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#bg)"/>
  
  <!-- Dynamic Animated Floating Cards Background Elements (Behind text) -->
  <g class="pulse-glow" opacity="0.4">
    <circle cx="150" cy="120" r="140" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="1050" cy="120" r="130" fill="#ec4899" filter="url(#glow)"/>
  </g>

  <!-- Background Decorative Grid Lines -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M200 0 V240 M400 0 V240 M600 0 V240 M800 0 V240 M1000 0 V240" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Left Card Graphic -->
  <g class="floating-card" transform="translate(80, 40)">
    <rect width="90" height="135" rx="8" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="2"/>
    <text x="45" y="75" font-family="serif" font-size="36" fill="#ffffff" text-anchor="middle" opacity="0.9">♠</text>
  </g>

  <!-- Right Card Graphic -->
  <g class="floating-card-2" transform="translate(1030, 60)">
    <rect width="90" height="135" rx="8" fill="url(#cardGrad2)" stroke="#ec4899" stroke-width="2"/>
    <text x="45" y="75" font-family="serif" font-size="36" fill="#ffffff" text-anchor="middle" opacity="0.9">♦</text>
  </g>

  <!-- Content Foreground (Guaranteed Clear & Above Dynamic Elements) -->
  <g transform="translate(220, 85)">
    <!-- Category Pill -->
    <rect x="0" y="-35" width="280" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
    <text x="14" y="-16" class="badge-text">🃏 CURATED DIGITAL CARD GAMES</text>

    <!-- Main Title -->
    <text x="0" y="25" class="title">Awesome Digital Card Games</text>
    
    <!-- Subtitle -->
    <text x="0" y="65" class="subtitle">Solitaire Collections • TCG Engines • Roguelike Deckbuilders • Multiplayer</text>
  </g>
</svg>
